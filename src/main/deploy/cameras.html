<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PhotonVision Streams</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .camera {
            background: #222;
            padding: 10px;
            border-radius: 10px;
        }

        img {
            width: 100%;
            border-radius: 8px;
        }

        .label {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>PhotonVision Camera Streams</h1>

    <div class="grid">
        <div class="camera">
            <img src="http://roborio-5724-frc.local:5806/stream.mjpg" data-port="5806">
            <div class="label">Front Camera</div>
        </div>

        <div class="camera">
            <img src="http://roborio-5724-frc.local:5808/stream.mjpg" data-port="5808">
            <div class="label">Back Camera</div>
        </div>

        <div class="camera">
            <img src="http://roborio-5724-frc.local:5810/stream.mjpg" data-port="5810">
            <div class="label">Right Camera</div>
        </div>
    </div>
    <script defer>
        const host = location.hostname;
        [...document.querySelectorAll('img')].forEach(img => {
            const port = img.dataset.port;
            img.src = `http://${host}:${port}/stream.mjpg`;
        });
    </script>
</body>
</html>
